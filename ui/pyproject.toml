[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "fractal-studio-ui"
version = "0.1.0"
description = "PySide6 shell for Fractal Studio."
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8"]

[project.scripts]
fractal-studio = "fractal_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

